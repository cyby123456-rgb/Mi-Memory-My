services:
  mimemory:
    build: .
    ports:
      - "8765:8765"
    environment:
      RETENTION_DAYS: "30"
      MIMEMORY_API_TOKEN: "${MIMEMORY_API_TOKEN:-}"
      MIMEMORY_RUNTIME: "${MIMEMORY_RUNTIME:-paper}"
      # Remote calls remain off unless the operator explicitly enables this run.
      MIMEMORY_LIVE_PROVIDER_APPROVED: "${MIMEMORY_LIVE_PROVIDER_APPROVED:-0}"
    env_file:
      - .env
    volumes:
      - mimemory-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mimemory-data:
